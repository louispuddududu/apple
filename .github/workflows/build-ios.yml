name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
defaults:
  run:
    working-directory: wallet-ios-project
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npm install capacitor-native-biometric --legacy-peer-deps
      - run: npx cap add ios
      - name: Icona
        run: |
          f=$(ls ios/App/App/Assets.xcassets/AppIcon.appiconset/*.png | head -1)
          sips -s format png -z 1024 1024 icon.jpg --out "$f"
      - name: Permesso Face ID
        run: /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string 'Wallet Demo usa Face ID per proteggere i dati della carta'" ios/App/App/Info.plist
      - run: npx cap sync ios
      - name: Build (senza firma)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/App.xcarchive" \
            archive -quiet CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry ../../WalletDemo.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: WalletDemo-ipa
          path: wallet-ios-project/WalletDemo.ipa
