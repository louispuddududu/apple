name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
# Il progetto Expo sta nella radice del repository.
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Usa l'Xcode più recente disponibile
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Uso $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - run: npm install --legacy-peer-deps

      # Reanimated 4 richiede react-native-worklets (la versione giusta la sceglie Expo)
      - name: Installa react-native-worklets
        run: npx expo install react-native-worklets -- --legacy-peer-deps

      # Genera il progetto iOS nativo. Face ID e notifiche arrivano dai plugin in app.json.
      - name: Genera progetto iOS
        run: npx expo prebuild --platform ios

      # In modalità CI Expo non installa i Pods: lo facciamo noi
      - name: Installa i Pods
        run: |
          cd ios
          pod install

      - name: Build (senza firma)
        run: |
          set -o pipefail
          cd ios
          if ls -d *.xcworkspace >/dev/null 2>&1; then
            WORKSPACE=$(ls -d *.xcworkspace | head -1)
            TARGET="-workspace $WORKSPACE"
            SCHEME="${WORKSPACE%.xcworkspace}"
          else
            PROJECT=$(ls -d *.xcodeproj | head -1)
            TARGET="-project $PROJECT"
            SCHEME="${PROJECT%.xcodeproj}"
          fi
          xcodebuild $TARGET -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$PWD/build/App.xcarchive" \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee ../build.log
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -qry ../Wallet.ipa Payload

      # Se qualcosa fallisce, mostra in fondo le righe di errore
      - name: Mostra gli errori
        if: failure()
        run: grep -nE "error:|ARCHIVE FAILED|failed with a nonzero" build.log | head -40 || true

      - name: Salva il log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: Wallet-ipa
          path: Wallet.ipa
